apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: panjika
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: panjika
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/HiteshRepo/k3s-homelab
    targetRevision: HEAD
    path: gitops/manifests/panjika
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
