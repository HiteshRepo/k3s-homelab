apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: https://github.com/hiteshrepo/k3s-homelab
      path: gitops/manifests/monitoring-namespace
      targetRevision: main
    - chart: kube-prometheus-stack
      repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 80.0.0
      helm:
        skipCrds: false
        values: |
          crds:
            enabled: true
          prometheusOperator:
            admissionWebhooks:
              enabled: false
            tls:
              enabled: false
          grafana:
            adminPassword: admin
            ingress:
              enabled: false
            sidecar:
              dashboards:
                enabled: true
                label: grafana_dashboard
                labelValue: "1"
                searchNamespace: ALL
              datasources:
                enabled: true
                label: grafana_datasource
                labelValue: "1"
                searchNamespace: ALL
          prometheus:
            prometheusSpec:
              retention: 30d
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: local-path
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 10Gi
  syncPolicy:
    automated: {}
    syncOptions:
      - ServerSideApply=true
      - Replace=true
      - Validate=false
      - RespectIgnoreDifferences=true
