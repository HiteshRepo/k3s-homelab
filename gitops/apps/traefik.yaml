apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: traefik-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    targetRevision: 37.4.0
    helm:
      values: |
        deployment:
          replicas: 1

        service:
          type: LoadBalancer
          annotations:
            metallb.universe.tf/loadBalancerIPs: 192.168.1.200

        ports:
          web:
            port: 80
            exposedPort: 80
            expose:
              default: true
          websecure:
            port: 443
            exposedPort: 443
            expose:
              default: true
            tls:
              enabled: true

        providers:
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true
          kubernetesIngress:
            enabled: true
            publishedService:
              enabled: true

        ingressClass:
          enabled: true
          isDefaultClass: true

        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik.lab.hiteshp.in`)
            entryPoints:
              - websecure
            tls: {}

        logs:
          general:
            level: INFO
          access:
            enabled: true

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        persistence:
          enabled: true
          storageClass: local-path
          size: 1Gi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
