apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: syncthing
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: syncthing
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/hiteshrepo/k3s-homelab.git
    targetRevision: main
    path: gitops/manifests/syncthing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
