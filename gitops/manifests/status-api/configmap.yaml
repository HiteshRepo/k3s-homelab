apiVersion: v1
kind: ConfigMap
metadata:
  name: status-api-devices
  namespace: status-api
data:
  devices.yaml: |
    devices:
      - id: legion
        name: Legion 5i (K8s node)
        kind: k8s-node
        ownership: personal

      - id: legion-host
        name: Legion 5i (Host OS)
        kind: linux
        host: 192.168.29.146
        port: 9101
        ownership: personal

      - id: macbook-work
        name: MacBook Work
        kind: mac
        host: 192.168.29.231
        port: 9100
        ownership: company
        cleanup_on_offboard: true

      - id: ipad-pro
        name: iPad Pro
        kind: ios
        ownership: personal

      - id: iphone-11
        name: iPhone 11
        kind: ios
        ownership: personal
