apiVersion: v1
kind: ServiceAccount
metadata:
  name: status-api
  namespace: status-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: status-api
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: status-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: status-api
subjects:
  - kind: ServiceAccount
    name: status-api
    namespace: status-api
