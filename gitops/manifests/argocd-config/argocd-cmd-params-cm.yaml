apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
data:
  # Run ArgoCD server without TLS — Traefik handles HTTPS termination
  server.insecure: "true"
  # Poll Git every 24 hours — homelab only, no need for frequent reconciliation
  timeout.reconciliation: 86400s
