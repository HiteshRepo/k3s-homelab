apiVersion: batch/v1
kind: CronJob
metadata:
  name: kopia-backup
  namespace: kopia
spec:
  schedule: "30 20 * * *"  # 2:00 AM IST (UTC+5:30) — runs after etcd snapshot at 1:30 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: kopia
              image: kopia/kopia:latest
              command:
                - sh
                - -c
                - |
                  set -e
                  echo "=== Kopia Daily Backup - $(date) ==="

                  kopia repository connect s3 \
                    --bucket=hitesh-homelab-backup \
                    --endpoint=s3.eu-central-003.backblazeb2.com \
                    --access-key=$B2_KEY_ID \
                    --secret-access-key=$B2_APPLICATION_KEY \
                    --password=$KOPIA_PASSWORD \
                    --override-username=hitesh \
                    --override-hostname=lenovo

                  echo "--- Backing up docs ---"
                  kopia snapshot create /mnt/external/docs

                  # d750, eng, z6 1 excluded — too large for B2 free tier (20GB total)
                  # Safely stored on external HDD at /mnt/external/photos/Pics/

                  echo "--- Backing up Immich library ---"
                  kopia snapshot create /mnt/immich

                  echo "--- Backing up Immich postgres ---"
                  kopia snapshot create /mnt/pvcs/immich-postgres

                  echo "--- Backing up Open WebUI ---"
                  kopia snapshot create /mnt/pvcs/open-webui

                  echo "--- Backing up Kopia config ---"
                  kopia snapshot create /mnt/pvcs/kopia-config

                  echo "--- Backing up k3s SQLite database ---"
                  kopia snapshot create /mnt/k3s-db

                  echo "--- Running maintenance ---"
                  kopia maintenance run

                  echo "=== Backup complete - $(date) ==="
              env:
                - name: KOPIA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: kopia-b2-credentials
                      key: KOPIA_PASSWORD
                - name: B2_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: kopia-b2-credentials
                      key: B2_KEY_ID
                - name: B2_APPLICATION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: kopia-b2-credentials
                      key: B2_APPLICATION_KEY
                - name: TZ
                  value: "Asia/Kolkata"
              volumeMounts:
                - name: kopia-config
                  mountPath: /app/config
                - name: kopia-cache
                  mountPath: /app/cache
                - name: external-hdd
                  mountPath: /mnt/external
                - name: pendrive
                  mountPath: /mnt/pendrive
                - name: immich-library
                  mountPath: /mnt/immich
                - name: pvcs
                  mountPath: /mnt/pvcs
                - name: k3s-db
                  mountPath: /mnt/k3s-db
              resources:
                requests:
                  memory: 512Mi
                limits:
                  memory: 2Gi
          volumes:
            - name: kopia-config
              persistentVolumeClaim:
                claimName: kopia-config-pvc
            - name: kopia-cache
              emptyDir: {}
            - name: external-hdd
              hostPath:
                path: /mnt/external
                type: Directory
            - name: pendrive
              hostPath:
                path: /mnt/pendrive2
                type: Directory
            - name: immich-library
              hostPath:
                path: /opt/local-path-provisioner/pvc-2a569fe3-80a3-422e-8b99-7d36daaf68cf_immich_immich-library-pvc
                type: Directory
            - name: pvcs
              hostPath:
                path: /opt/local-path-provisioner
                type: Directory
            - name: k3s-db
              hostPath:
                path: /var/lib/rancher/k3s/server/db
                type: Directory
