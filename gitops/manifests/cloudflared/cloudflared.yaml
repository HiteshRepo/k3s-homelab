# The cloudflared-token secret must be created manually before this deploys:
#   make cloudflared-secret TUNNEL_TOKEN=<token>
#
# In the Cloudflare Zero Trust dashboard, set the tunnel public hostname to:
#   Hostname: chat.yourdomain.com
#   Service:  http://open-webui.ollama.svc.cluster.local:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args: ["tunnel", "--no-autoupdate", "run"]
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-token
              key: token
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
