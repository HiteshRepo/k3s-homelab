apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kopia-headers
  namespace: traefik-system
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
      X-Forwarded-Host: "kopia.lab.hiteshp.in"
    customResponseHeaders:
      X-Frame-Options: ""
    sslProxyHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kopia-sticky
  namespace: traefik-system
spec:
  sticky:
    cookie:
      name: kopia_session
      secure: true
      httpOnly: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kopia
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kopia.lab.hiteshp.in`)
      kind: Rule
      middlewares:
        - name: kopia-headers
      services:
        - name: kopia
          namespace: kopia
          port: 51515
  tls: {}
