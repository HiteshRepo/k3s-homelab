apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`immich.lab.hiteshp.in`)
      kind: Rule
      services:
        - name: immich-server
          namespace: immich
          port: 2283
  tls: {}
