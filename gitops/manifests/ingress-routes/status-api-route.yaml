apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: status-api
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`status-api.lab.hiteshp.in`)
      kind: Rule
      services:
        - name: status-api
          namespace: status-api
          port: 8080
  tls: {}
