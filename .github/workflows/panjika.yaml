name: Build and push panjika image

on:
  push:
    branches: [main]
    paths:
      - 'tools/panjika/**'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/hiteshrepo/panjika

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: tools/panjika
          push: true
          tags: |
            ${{ env.IMAGE }}:2027
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
